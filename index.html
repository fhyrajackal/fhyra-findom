<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #120306;
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 1rem;
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background:
      radial-gradient(ellipse at 25% 40%, rgba(140, 30, 50, 0.55) 0%, transparent 45%),
      radial-gradient(ellipse at 75% 60%, rgba(100, 15, 35, 0.7) 0%, transparent 50%),
      radial-gradient(circle at 50% 30%, rgba(180, 50, 70, 0.3) 0%, transparent 40%),
      radial-gradient(ellipse at 40% 80%, rgba(60, 5, 15, 0.85) 0%, transparent 55%),
      radial-gradient(circle at 60% 70%, rgba(200, 80, 40, 0.15) 0%, transparent 35%);
    animation: stomachPulse 14s ease-in-out infinite, stomachShift 20s linear infinite;
    z-index: -3;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 30% 20%, rgba(255, 120, 140, 0.08) 0%, transparent 30%),
      radial-gradient(circle at 70% 80%, rgba(180, 60, 40, 0.06) 0%, transparent 25%),
      repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 80px, rgba(160, 40, 60, 0.03) 81px, transparent 82px);
    z-index: -2;
    pointer-events: none;
    animation: subtleGlow 8s ease-in-out infinite;
  }
  @keyframes stomachPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.06) rotate(0.5deg); }
  }
  @keyframes stomachShift {
    0% { background-position: 0% 0%; }
    100% { background-position: 2% 3%; }
  }
  @keyframes subtleGlow {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  #bubbles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255, 180, 190, 0.7), rgba(180, 40, 60, 0.3) 70%, transparent);
    border: 1px solid rgba(255, 150, 160, 0.4);
    animation: rise linear forwards;
    opacity: 0.8;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    10% { opacity: 0.85; }
    90% { opacity: 0.7; }
    100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
  }
  h1 {
    margin: 0.5rem 0 1.2rem;
    font-weight: 300;
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 0 25px rgba(180, 40, 60, 0.6);
    font-size: clamp(1.5rem, 7vw, 2.1rem);
  }
  .container {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 520px;
  }
  .box {
    background: rgba(15, 4, 8, 0.72);
    border: 1px solid rgba(160, 50, 70, 0.45);
    border-radius: 16px;
    padding: 1.4rem 1rem;

    flex: 1 1 160px;

    backdrop-filter: blur(6px);

  .box h2 {
    margin: 0 0 0.6rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: #d08090;
    text-transform: uppercase;
    letter-spacing: 0.5px;

  .value {
    font-size: clamp(2rem, 12vw, 2.8rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    text-shadow: 0 0 18px rgba(255, 100, 120, 0.35);
  }
  #amount { color: #ff7a95; }
  #time { color: #ffc2ce; }
  .controls, .room, .payment-buttons, .end-section {
    margin-top: 1.4rem;
    text-align: center;
    width: 100%;
    max-width: 420px;
  }
  button, input {
    padding: 1rem 1.3rem;
    font-size: 1.05rem;
    border-radius: 12px;
    border: none;
    margin: 0.35rem;
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  button {
    background: #c0264a;
    color: white;
    cursor: pointer;
    font-weight: 500;
    width: min(100%, 280px);
  }
  button:active { background: #a21a3a; transform: scale(0.98); }
  button.end-btn { background: #7f1d1d; }
  button.end-btn:active { background: #991b1b; }
  button.pay-btn { background: #0070ba; width: min(100%, 220px); }
  button.pay-btn:active { background: #005ea6; }
  button.throne-btn { background: #7c3aed; width: min(100%, 220px); }
  button.throne-btn:active { background: #6d28d9; }
  input {
    background: rgba(25, 6, 10, 0.85);
    color: white;
    border: 1px solid rgba(160, 50, 70, 0.5);
    width: min(100%, 280px);
    font-size: 16px;
  }
  .room, .end-section { font-size: 1.05rem; line-height: 1.5; }
  .room span, .end-section span {
    font-family: ui-monospace, monospace;
    background: rgba(35, 8, 12, 0.85);
    padding: 0.45rem 0.8rem;
    border-radius: 8px;
    border: 1px solid rgba(160, 50, 70, 0.35);
    word-break: break-all;
    display: inline-block;
    margin: 0.3rem 0;
  }
  .payment-buttons { display: none; }
  .payment-buttons a { text-decoration: none; display: block; margin: 0.4rem 0; }
  #status {
    margin: 0.6rem 0 0.2rem;
    color: #d08090;
    font-size: 0.95rem;
    min-height: 1.3em;
    text-align: center;
  }
  #chatBox {
    display: none;
    width: 100%;
    max-width: 420px;
    margin-top: 1.2rem;
    background: rgba(15, 4, 8, 0.8);
    border: 1px solid rgba(160, 50, 70, 0.45);
    border-radius: 16px;
    padding: 0.8rem;
    backdrop-filter: blur(6px);
  }
  #messages {
    height: 180px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0.5rem;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
    margin-bottom: 0.7rem;
    font-size: 0.95rem;
    line-height: 1.45;
  }
  #messages div {
    margin: 0.35rem 0;
    padding: 0.45rem 0.7rem;
    border-radius: 8px;
    word-wrap: break-word;
  }
  .msg-self { background: rgba(160, 40, 60, 0.4); text-align: right; }
  .msg-other { background: rgba(80, 20, 40, 0.4); }
  #chatRow {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }
  #chatInput {
    flex: 1;
    margin: 0;
    width: auto;
    min-width: 0;
  }
  #sendBtn {
    width: auto;
    flex-shrink: 0;
    padding-left: 1.1rem;
    padding-right: 1.1rem;
  }
</style>

<script>
// ====== PASTE YOUR FIREBASE CONFIG HERE ======
const firebaseConfig = {
  apiKey: "AIzaSyAd6FDdxOKZveL4xN0TxuuVrdLG-ePtP30",
  authDomain: "fhyra-findom.firebaseapp.com",
  databaseURL: "https://fhyra-findom-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "fhyra-findom",
  storageBucket: "fhyra-findom.firebasestorage.app",
  messagingSenderId: "311734498431",
  appId: "1:311734498431:web:990625516cfb4ab985fb4a",
  measurementId: "G-WFDNCH294B"
};
// =============================================

 console.log("Config object:", firebaseConfig);

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();
console.log("Firebase initialized:", firebase.app().options.databaseURL);

// Firebase's server offset keeps sessions aligned even when a phone's clock is wrong.
let serverTimeOffset = 0;
db.ref(".info/serverTimeOffset").on("value", (snapshot) => {
  serverTimeOffset = Number(snapshot.val()) || 0;
  console.log("[SERVER CLOCK] offset ms:", serverTimeOffset);
});
function getServerNow() {
  return Date.now() + serverTimeOffset;
}

let startTime = null;
let endTime = null;
let animationId = null;
let lastFrame = 0;
let isInitiator = false;
let bubbleInterval = null;
let bubbleStartTimeout = null;
let currentRoomCode = null;
let messagesRef = null;
let roomRef = null;
let myName = null;
let initiatorName = "";
let startTimeRef = null;
let endTimeRef = null;
let resetRef = null;
let messagesQuery = null;
const ACTIVE_SESSION_KEY = "worshipTrueGoddess.activeSession.v1";

const RATE_PER_MINUTE = 3;

function setStatus(msg) {
  document.getElementById("status").textContent = msg || "";
}

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const h = Math.floor(totalSeconds / 3600).toString().padStart(2, "0");
  const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, "0");
  const s = (totalSeconds % 60).toString().padStart(2, "0");
  return `${h}:${m}:${s}`;
}

function getElapsedMs() {
  if (!startTime) return 0;
  const now = endTime ? Number(endTime) : getServerNow();
  return Math.max(0, now - Number(startTime));
}

function getFinalAmount() {
  const elapsedMs = getElapsedMs();
  return ((elapsedMs / 60000) * RATE_PER_MINUTE).toFixed(2);
}

function updateDisplay() {
  if (!startTime) return;

  // Never depend on setInterval having run while the app was backgrounded.
  // Recalculate from shared timestamps every time the UI is refreshed.
  const now = endTime ? Number(endTime) : getServerNow();
  const elapsedMs = Math.max(0, now - Number(startTime));

  document.getElementById("amount").textContent =
    "$" + ((elapsedMs / 60000) * RATE_PER_MINUTE).toFixed(2);
  document.getElementById("time").textContent = formatTime(elapsedMs);
}

function saveActiveSession(code, role, username = "") {
  try {
    localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify({ code: String(code), role, username }));
  } catch (error) {
    console.warn("Could not persist active session on this device:", error);
  }
}

function readActiveSession() {
  try {
    const saved = JSON.parse(localStorage.getItem(ACTIVE_SESSION_KEY) || "null");
    if (saved && /^\d+$/.test(String(saved.code)) && ["initiator", "joiner"].includes(saved.role)) {
      return { code: String(saved.code), role: saved.role, username: typeof saved.username === "string" ? saved.username : "" };
    }
  } catch (error) {
    console.warn("Could not restore saved session:", error);
  }
  return null;
}

function showEndedState() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  if (animationId) cancelAnimationFrame(animationId);
  updateDisplay();
  stopBubbles();
  setStatus("Session ended");

  // The joiner controls resetting the shared session. The reset event is
  // written to Firebase so both participants return to the main menu together.
  document.getElementById("endSection").style.display = "block";
  document.getElementById("resetSessionContainer").innerHTML = isInitiator
    ? ""
    : '<button type="button" onclick="resetSessionForBoth()">Reset Session for Both</button>';
  if (isInitiator) {
    const finalAmount = getFinalAmount();
    document.getElementById("paypalLink").href = `https://paypal.me/fhyrapaypal/${finalAmount}`;
    document.getElementById("paymentButtons").style.display = "block";
  } else {
    document.getElementById("paymentButtons").style.display = "none";
  }
  document.getElementById("endButtonContainer").innerHTML = "";
}

function returnToMainMenu() {
  // Detach all listeners from the finished room so old Firebase events cannot
  // put the UI back on the ended/payment screen after returning to the menu.
  if (messagesQuery) messagesQuery.off();
  if (messagesRef) messagesRef.off();
  if (startTimeRef) startTimeRef.off();
  if (endTimeRef) endTimeRef.off();
  if (resetRef) resetRef.off();
  if (roomRef) roomRef.off();

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
  stopBubbles();

  try { localStorage.removeItem(ACTIVE_SESSION_KEY); } catch (error) {
    console.warn("Could not clear saved session:", error);
  }

  // Remove ?start=ROOM_CODE so refreshing cannot automatically rejoin the old room.
  if (window.location.search) {
    const cleanUrl = window.location.pathname + window.location.hash;
    window.history.replaceState({}, document.title, cleanUrl);
  }

  startTime = null;
  endTime = null;
  currentRoomCode = null;
  messagesRef = null;
  roomRef = null;
  myName = null;
  startTimeRef = null;
  endTimeRef = null;
  resetRef = null;
  messagesQuery = null;
  isInitiator = false;

  document.getElementById("amount").textContent = "$0.00";
  document.getElementById("time").textContent = "00:00:00";
  document.getElementById("roomCode").textContent = "";
  document.getElementById("roomInput").value = "";
  document.getElementById("chatInput").value = "";
  document.getElementById("messages").innerHTML = "";
  document.getElementById("endButtonContainer").innerHTML = "";
  document.getElementById("roomDisplay").style.display = "none";
  document.getElementById("chatBox").style.display = "none";
  document.getElementById("paymentButtons").style.display = "none";
  document.getElementById("endSection").style.display = "none";
  document.getElementById("controls").style.display = "block";
  setStatus("");
}

let timerInterval = null;

function startLoop() {
  console.log("[TIMER] startLoop called", {
    isInitiator,
    startTime,
    endTime
  });

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  if (!startTime || endTime) {
    console.warn("[TIMER] Not started", { startTime, endTime });
    return;
  }

  updateDisplay();

  timerInterval = setInterval(updateDisplay, 1000);

  console.log("[TIMER] Interval running");
}

function loop() {}

function spawnBubble() {
  const bubbles = document.getElementById("bubbles");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const size = 12 + Math.random() * 40;
  const left = Math.random() * 100;
  const duration = 6 + Math.random() * 8;
  const delay = Math.random() * 0.5;
  bubble.style.width = size + "px";
  bubble.style.height = size + "px";
  bubble.style.left = left + "%";
  bubble.style.animationDuration = duration + "s";
  bubble.style.animationDelay = delay + "s";
  if (Math.random() > 0.7) {
    bubble.style.background = "radial-gradient(circle at 30% 30%, rgba(255, 200, 100, 0.6), rgba(160, 80, 30, 0.35) 70%, transparent)";
  }
  bubbles.appendChild(bubble);
  setTimeout(() => bubble.remove(), (duration + delay) * 1000);
}

function startBubbles() {
  if (bubbleStartTimeout) return;
  bubbleStartTimeout = setTimeout(() => {
    bubbleStartTimeout = null;
    spawnBubble();
    bubbleInterval = setInterval(() => {
      const count = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        setTimeout(spawnBubble, Math.random() * 800);
      }
    }, 1200 + Math.random() * 1800);
  }, 25000);
}

function stopBubbles() {
  if (bubbleStartTimeout) clearTimeout(bubbleStartTimeout);
  if (bubbleInterval) clearInterval(bubbleInterval);
  bubbleStartTimeout = null;
  bubbleInterval = null;
  document.getElementById("bubbles").innerHTML = "";
}

function addMessage(text, isSelf) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = isSelf ? "msg-self" : "msg-other";
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function startChat(roomCode) {
  // Detach listeners from a previous room before switching sessions.
  if (messagesQuery) messagesQuery.off();
  if (startTimeRef) startTimeRef.off();
  if (endTimeRef) endTimeRef.off();
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  stopBubbles();
  startTime = null;
  endTime = null;

  currentRoomCode = String(roomCode);
  myName = isInitiator ? (initiatorName || "Initiator") : "Fhyra";
  roomRef = db.ref("rooms/" + currentRoomCode);
  messagesRef = roomRef.child("messages");
  startTimeRef = roomRef.child("startTime");
  endTimeRef = roomRef.child("endTime");
  resetRef = roomRef.child("resetAt");
  messagesQuery = messagesRef.orderByChild("timestamp");

  document.getElementById("roomCode").textContent = currentRoomCode;
  document.getElementById("roomDisplay").style.display = "block";
  document.getElementById("controls").style.display = "none";
  document.getElementById("messages").innerHTML = "";
  document.getElementById("paymentButtons").style.display = "none";
  document.getElementById("endSection").style.display = "none";
  document.getElementById("chatBox").style.display = "block";

  messagesQuery.on("child_added", (snapshot) => {
    const msg = snapshot.val();
    if (!msg || typeof msg.text !== "string") return;
    addMessage(msg.text, msg.sender === myName);
  });

  startTimeRef.on("value", (snap) => {
    const val = Number(snap.val());
    if (!Number.isFinite(val) || val <= 0) return;
    startTime = val;
    if (endTime) {
      updateDisplay();
      showEndedState();
    } else {
      setStatus("Session started");
      startLoop();
      startBubbles();
    }
  });

  endTimeRef.on("value", (snap) => {
    const val = Number(snap.val());
    if (Number.isFinite(val) && val > 0) {
      endTime = val;
      showEndedState();
    }
  });

  resetRef.on("value", (snap) => {
    const val = Number(snap.val());
    if (Number.isFinite(val) && val > 0) {
      returnToMainMenu();
    }
  });
}

function sendMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text || !messagesRef) return;

  messagesRef.push({
    text: text,
    sender: myName,
    timestamp: Date.now()
  });

  input.value = "";
}

document.getElementById("chatInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendMessage();
});

// Put these near the top of your script with your real values
const EMAILJS_PUBLIC_KEY = "6yUaltYoDr-gtit33";
const EMAILJS_SERVICE_ID = "service_yhtrk8j";
const EMAILJS_TEMPLATE_ID = "template_49qhzsr";

emailjs.init(EMAILJS_PUBLIC_KEY);

function initiateSession() {

  const enteredName = nameInput.value.trim().replace(/\\s+/g, " ");
  if (!enteredName) {
    setStatus("Please enter your username first.");
    nameInput.focus();
    return;
  }

  initiatorName = enteredName.slice(0, 40);
  isInitiator = true;
  const code = Date.now().toString();
  saveActiveSession(code, "initiator", initiatorName);
  document.getElementById("roomCode").textContent = code;
  document.getElementById("roomDisplay").style.display = "block";
  document.getElementById("controls").style.display = "none";

  setStatus("Waiting for joiner…");
  startChat(code);

  // Build a direct join link
  const joinLink = JOIN_BASE_URL + "/?start=" + encodeURIComponent(code);

  setStatus("Sending join email…");
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: "hanychlaura@gmail.com",
    join_link: joinLink,
    room_code: code,
    initiator_username: initiatorName
  }).then(() => {
    setStatus("Join email sent — waiting for Fhyra to ruin you~");
  }).catch((err) => {
    console.error("Email failed:", err);
    setStatus("Email failed — share the room code manually");
  });

}

function joinRoomByCode(code) {
  isInitiator = false;
  initiatorName = "";
  code = String(code);
  saveActiveSession(code, "joiner");

  document.getElementById("roomCode").textContent = code;
  document.getElementById("roomDisplay").style.display = "block";
  document.getElementById("controls").style.display = "none";

  setStatus("Joining room…");

  const room = db.ref("rooms/" + code);

  db.ref(".info/serverTimeOffset").once("value").then((offsetSnapshot) => {
    serverTimeOffset = Number(offsetSnapshot.val()) || serverTimeOffset;
    return room.child("startTime").transaction(
      (current) => current || getServerNow(),
      (error, committed, snapshot) => {
        if (error) {
          console.error("Failed to join room:", error);
          setStatus("Error joining: " + error.message);
          return;
        }

        if (!snapshot.exists() || !snapshot.val()) {
          setStatus("Could not obtain session start time.");
          return;
        }

        setStatus(
          committed
            ? "Joined — session started"
            : "Joined existing session"
        );

        // Both manual-code and emailed-link joins initialize the same listeners.
        startChat(code);
        document.getElementById("endButtonContainer").innerHTML =
          '<button class="end-btn" onclick="endSession()">End Session</button>';
      }
    );
  }).catch((error) => {
    console.error("Failed to get Firebase server time:", error);
    setStatus("Could not connect to Firebase. Check your connection and retry.");
  });
}

function joinSession() {
  const code = document.getElementById("roomInput").value.trim();

  if (!/^\d+$/.test(code)) {
    alert("Please enter a valid room code");
    return;
  }

  joinRoomByCode(code);
}

function resetSessionForBoth() {
  // Only the joiner can reset the room for both participants.
  if (isInitiator || !endTime || !roomRef || !resetRef) return;
  setStatus("Resetting session for both participants…");
  resetRef.set(getServerNow()).then(() => {
    // The initiator's reset listener will return their device to the main menu.
    returnToMainMenu();
  }).catch((error) => {
    console.error("Could not reset session:", error);
    setStatus("Could not reset session. Check your connection and try again.");
  });
}

function endSession() {
  if (isInitiator || endTime || !roomRef) return;

  const now = getServerNow();
  roomRef.child("endTime").set(now).catch((error) => {
    console.error("Could not end session:", error);
    setStatus("Could not end session. Check your connection and try again.");
  });

  if (messagesRef) {
    messagesRef.push({
      text: "[Session ended by joiner]",
      sender: "System",
      timestamp: now
    });
  }

  document.getElementById("endButtonContainer").innerHTML = "";
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    return Promise.resolve();
  } catch (e) {
    return Promise.reject(e);
  } finally {
    document.body.removeChild(ta);
  }
}

function copyCode() {
  const code = document.getElementById("roomCode").textContent;
  copyToClipboard(code)
    .then(() => alert("Room code copied!"))
    .catch(() => alert("Copy failed — please select and copy manually"));
}

function restoreSavedSession() {
  const saved = readActiveSession();
  if (!saved) return false;

  isInitiator = saved.role === "initiator";
  initiatorName = isInitiator ? (saved.username || "") : "";
  const nameInput = document.getElementById("initiatorNameInput");
  if (nameInput && isInitiator && initiatorName) nameInput.value = initiatorName;
  document.getElementById("roomCode").textContent = saved.code;
  document.getElementById("roomDisplay").style.display = "block";
  document.getElementById("controls").style.display = "none";
  setStatus("Restoring session…");
  startChat(saved.code);

  if (!isInitiator) {
    document.getElementById("endButtonContainer").innerHTML =
      '<button class="end-btn" onclick="endSession()">End Session</button>';
  }
  return true;
}

async function refreshRoomState() {
  if (!roomRef) return;
  try {
    // Refresh the server offset and both durable timestamps after a resume/reconnect.
    const offsetSnapshot = await db.ref(".info/serverTimeOffset").once("value");
    serverTimeOffset = Number(offsetSnapshot.val()) || serverTimeOffset;
    const [startSnapshot, endSnapshot] = await Promise.all([
      roomRef.child("startTime").once("value"),
      roomRef.child("endTime").once("value")
    ]);

    const startVal = Number(startSnapshot.val());
    const endVal = Number(endSnapshot.val());
    if (Number.isFinite(startVal) && startVal > 0) startTime = startVal;
    if (Number.isFinite(endVal) && endVal > 0) endTime = endVal;

    if (endTime) {
      showEndedState();
    } else if (startTime) {
      setStatus("Session started");
      startLoop();
      startBubbles();
    }
  } catch (error) {
    // Firebase listeners will retry when connectivity returns; do not erase local state.
    console.warn("Could not refresh session state yet:", error);
    updateDisplay();
  }
}

function handleAppResume() {
  if (!roomRef) return;
  // Paint a current estimate immediately, even if the network is still reconnecting.
  updateDisplay();
  if (startTime && !endTime) startLoop();
  refreshRoomState();
}

window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  const startParam = params.get("start");

  if (startParam && /^\d+$/.test(startParam)) {
    joinRoomByCode(startParam);
    return;
  }

  restoreSavedSession();
});

// Mobile browsers throttle JavaScript timers in the background. The session itself
// is timestamp-based, so stop cosmetic work while hidden and resync when visible.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    stopBubbles();
  } else {
    handleAppResume();
  }
});
window.addEventListener("pageshow", handleAppResume);
window.addEventListener("online", handleAppResume);
</script>
</body>
